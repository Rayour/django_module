<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="row">
        <nav class="navbar bg-body-tertiary vh-100 col-2 px-3" data-bs-theme="dark">
          <div class="container-fluid ">
            <a class="navbar-brand" href="#">
              <img src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
              Меню
            </a>
            <div class="navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Link</a>
                </li>
                <li class="nav-item dropdown">
                  <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Dropdown
                  </a>
                  <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Action</a></li>
                    <li><a class="dropdown-item" href="#">Another action</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#">Something else here</a></li>
                  </ul>
                </li>
                <li class="nav-item">
                  <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
        <div class="col-10">
            <h1>Главная</h1>
            <p>Вы находитесь на сайте, предназначенном для продажи товаров.</p>
            <div class="row"> <!-- Основной блок для работы с колонками -->
                <div class="col-2"></div>
                <div class="col-8"> <!-- Колонка шириной 8/12 для размещения основного контента -->
                    <div class="row mt-5"> <!-- Дополнительный вложенный блок для работы с колонками -->
                        <div class="col-7"> <!-- Колонка для отображения контактов -->
                            <div class="card text-bg-primary"> <!-- Карточка для визуального отделения вложенных данных -->
                                <div class="card-body"> <!-- Тело карточки, внутри которого размещаются данные -->
                                    <h2>Контактные данные:</h2>
                                    <div class="row">
                                        <div class="col-6">Москва</div>
                                        <div class="col-6">+7 777 777 7777</div>
                                    </div>
                                    <div class="row">
                                        <div class="col-6">Санкт-Петербург</div>
                                        <div class="col-6">+7 888 888 8888</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-5"> <!-- -->
                            <div class="card text-bg-secondary">
                                <div class="card-body">
                                    <form>
                                        <h2>Оставьте заявку</h2>
                                        <div class="mb-3">
                                            <input type="text" class="form-control" placeholder="Имя">
                                        </div>
                                        <div class="mb-3">
                                            <input type="email" class="form-control" placeholder="Email">
                                        </div>

                                        <div class="mb-3">
                                            <textarea class="form-control" placeholder="Сообщение" rows="3"></textarea>
                                        </div>
                                        <button type="submit" class="btn btn-primary w-100">Отправить</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
